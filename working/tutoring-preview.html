<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tutoring Support — live preview (not a paste target)</title>

<!-- NOT a LibGuides paste target. Assembles the real repo files at
     runtime (same-origin fetch, since this file is served from the
     same Amplify deploy as everything it's fetching) so it's always
     in sync with whatever's actually in the repo — nothing here is
     duplicated/hand-copied. Used to visually verify a subsite's
     header/hero/footer together before a Group/guide exists in
     LibGuides Admin to test against directly. -->

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<link href="/libguides/libguides-1-custom-css.css" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</head>
<body>

<div class="csp-backdrop" id="cspBackdrop" aria-hidden="true"></div>
<div id="system-header">Loading system header…</div>
<div id="subsite-header">Loading subsite header…</div>
<div id="subsite-hero">Loading hero…</div>
<div id="s-lg-guide-main" style="padding:32px 16px">
  <!-- Mimics a real LibGuides box's wrapper classes so site-wide
       .s-lib-box rules (white card, rounded corners, shadow, title
       bar) render the same way they would on a real guide page. -->
  <div class="s-lib-box s-lib-box-std" style="max-width:900px;margin:0 auto">
    <h2 class="s-lib-box-title">Need help deciding which tutoring service is right for you?</h2>
    <div class="s-lib-box-content" id="compare-services">Loading comparison…</div>
  </div>
</div>
<div id="subsite-footer">Loading footer…</div>

<script>
async function loadInto(id, path) {
  const res = await fetch(path);
  const html = await res.text();
  document.getElementById(id).outerHTML = html;
}
async function loadContentInto(id, path) {
  // Unlike loadInto, this fills the target's innerHTML rather than
  // replacing the element outright — used where the target element
  // itself (e.g. .s-lib-box-content) needs to persist as a real
  // wrapper, mimicking how LibGuides places a box's Rich Text content
  // inside its own fixed wrapper markup.
  const res = await fetch(path);
  const html = await res.text();
  document.getElementById(id).innerHTML = html;
}
(async () => {
  await Promise.all([
    loadInto('system-header', '/libguides/libguides-3-header-html.html'),
    loadInto('subsite-header', '/subsites/tutoring/group/header.html'),
    loadInto('subsite-hero', '/subsites/tutoring/guide/hero.html'),
    loadContentInto('compare-services', '/subsites/tutoring/guide/compare-services.html'),
    loadInto('subsite-footer', '/subsites/tutoring/group/footer.html'),
  ]);
  const jsRes = await fetch('/libguides/libguides-2-custom-js.js');
  let jsText = await jsRes.text();
  // Unlike the CSS, this file still carries its own wrapper tag pair
  // (it's still pasted into the Admin Custom JS field as-is) — strip
  // it here since we're creating the script element ourselves. Built
  // via concatenation, not written as a literal tag, so the HTML
  // parser of THIS file can't mistake it for a real closing tag and
  // end this inline script block early.
  const openTag = '<' + 'script>';
  const closeTag = '<' + '/' + 'script>';
  jsText = jsText.trim();
  if (jsText.startsWith(openTag)) jsText = jsText.slice(openTag.length);
  if (jsText.endsWith(closeTag)) jsText = jsText.slice(0, -closeTag.length);
  const script = document.createElement('script');
  script.textContent = jsText;
  document.body.appendChild(script);
  document.dispatchEvent(new Event('DOMContentLoaded'));
})();
</script>

</body>
</html>
