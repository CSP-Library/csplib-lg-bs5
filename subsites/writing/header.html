<!-- ==========================================================================
   Writing Center Subsite Nav — Group Custom Header
   Paste into: LibGuides → [Writing Center group] → Look & Feel → Header/Footer → Custom Header

   Relies on the system-wide Header (libguides-3-header-html.html) being
   inherited above this at the Group level — that's where the CSP Library
   navbar/logo and the "back to library" affordance live, and where
   Bootstrap 5 CSS/JS, Bootstrap Icons, and the Google Fonts link are
   loaded. This file has no back-to-library crumb of its own; it would
   just duplicate what the inherited system header already provides.
   ========================================================================== -->

        <span class="csp-sub-name">Writing Center</span>
      </div>

      <button class="csp-sub-toggle"
              aria-expanded="false"
              aria-controls="wcCollapse"

        </div>
      </div>

    </div>

    <div class="csp-sub-collapse" id="wcCollapse" hidden role="navigation" aria-label="Writing Center mobile menu">

        <a class="csp-sub-mobile-cta" href="https://library.csp.edu/undergrad-student/appt">
          <i class="bi bi-calendar-check" aria-hidden="true"></i>Make an Appointment
        </a>
