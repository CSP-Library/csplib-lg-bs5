<!-- ==========================================================================
   Tutoring Support Hero — Box Custom Content
   Version: 2

   PASTE AS RAW HTML, NOT VIA THE VISUAL EDITOR: open the box, click
   "Edit HTML Source" (the <> icon) in the Rich Text/HTML box toolbar,
   paste this whole file there, and save — do NOT paste into the plain
   WYSIWYG view. Confirmed live (2026-11): pasting this kind of nested
   markup through the visual Rich Text editor gets "cleaned up" by its
   sanitizer, which silently split every .hero-quick-tile's two inline
   children into 3 separate orphaned elements and broke the whole grid.
   The same applies to every other subsite header/footer/hero file in
   this repo, not just this one.

   Box settings: check "Floating Box" to enable the full-bleed wrapper.

   Background image: no Tutoring-specific photo yet, so .hero-bg has no
   inline override here — it inherits the default background-image set
   on .hero-bg in libguides-1-custom-css.css (the main site's hero
   photo). Same situation CIC started in; add an inline
   style="background-image:url('...')" on .hero-bg once a
   Tutoring-specific photo exists (comet.csplib.io is the current host
   for CIC's — see "Known Issues" in CLAUDE.md).

   Quick-link grid: replaces the usual .hero-ctas row. These are the
   six "quick access" tiles from the legacy page
   (https://library.csp.edu/tutoring-support/home), moved into the hero
   and rebuilt as a responsive CSS grid using Bootstrap Icons instead
   of the original raster icon images — same .hero-quick-grid/
   .hero-quick-tile component as any other subsite's hero could reuse
   (see libguides-1-custom-css.css, "Hero quick-link grid"). Each tile
   is a flat <a><i></i>Label text</a> — no wrapping <span>s — matching
   .csp-sub-dropdown-item's already-proven-safe shape; see the version
   history if you're wondering why this isn't nested more "cleanly".
   ========================================================================== -->
